services:
  communication:
    build: ./deployer
    container_name: communication
    ports:
      - "5001:5001"
    volumes:
      - ./bpmn:/bpmn
    depends_on:
      - zeebe
      - siddhi
  siddhi:
    build: ./siddhi
    container_name: siddhi-runtime
    ports:
      - "7071:7071"
      - "7072:7072"
      - "7073:7073"
      - "9390:9390"   # optional dashboard

  logging-service:
    build: ./logging_service
    container_name: logging-service
    ports:
      - "5010:5010"
    volumes:
      - ./logging_service/logs:/logs
      - ./logging_service/XES:/XES

  zeebe:
    image: camunda/zeebe:8.8.0
    container_name: zeebe
    ports:
      - "26501:26500"
      - "9601:9600"
    environment:
      CAMUNDA_SECURITY_AUTHENTICATION_UNPROTECTEDAPI: "true"
      CAMUNDA_SECURITY_AUTHORIZATIONS_ENABLED: "false"
      ZEEBE_BROKER_EXPORTERS_ELASTICSEARCH_CLASSNAME: io.camunda.zeebe.exporter.ElasticsearchExporter
      ZEEBE_BROKER_EXPORTERS_ELASTICSEARCH_ARGS_URL: http://elasticsearch:9200
    depends_on:
      - elasticsearch

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  operate:
    image: camunda/operate:8.8.0
    container_name: operate
    ports:
      - "8081:8080"
    depends_on:
      zeebe:
        condition: service_started
      elasticsearch:
        condition: service_healthy
    environment:
      CAMUNDA_OPERATE_ZEEBE_GATEWAYADDRESS: zeebe:26500
      CAMUNDA_OPERATE_ELASTICSEARCH_URL: http://elasticsearch:9200
      CAMUNDA_DATA_SECONDARY_STORAGE_ELASTICSEARCH_URL: http://elasticsearch:9200

